name: shachar-run
# Always-on host for Shachar. Starts every 5h, runs ~5h40m, the next run queues behind it (no overlap).
# Mode comes from repo variable SHACHAR_MODE (default dry). Real orders need the SHACHAR_LIVE secret, which stays unset until Idan says GO. State is saved to the `state` branch.
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shachar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Shachar (dry)
        env:
          LLM_KEY: ${{ secrets.LLM_KEY }}
          MODE: ${{ vars.SHACHAR_MODE || 'dry' }}
          KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
          KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
          SHACHAR_LIVE: ${{ secrets.SHACHAR_LIVE }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config --global user.name shachar
          git config --global user.email shachar@users.noreply.github.com
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/st
          (cd /tmp/st && { git checkout -q state 2>/dev/null || { git checkout -q --orphan state && git rm -rfq . ; } ; } ; true)
          for f in state_dry.json state_live.json journal.jsonl actions_dry.jsonl actions_live.jsonl lessons.md HALT; do [ -f /tmp/st/$f ] && cp /tmp/st/$f . || true; done
          save() {
            for f in state_dry.json state_live.json journal.jsonl actions_dry.jsonl actions_live.jsonl lessons.md HALT; do [ -f $f ] && cp $f /tmp/st/ || true; done
            (cd /tmp/st && find . -maxdepth 1 -type f ! -name state_dry.json ! -name state_live.json ! -name journal.jsonl ! -name actions_dry.jsonl ! -name actions_live.jsonl ! -name lessons.md ! -name HALT -delete; git add -A && (git diff --cached --quiet || git commit -q -m "state $(date -u +%FT%TZ)") && git push -q origin state) || echo "save failed"
          }
          python -u guard.py $MODE > run.log 2>&1 &
          PID=$!
          END=$((SECONDS+20400))
          while [ $SECONDS -lt $END ] && kill -0 $PID 2>/dev/null; do sleep 300; save; tail -n 3 run.log; done
          kill $PID 2>/dev/null || true
          sleep 3
          save
