name: tick
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python bot.py tick
      - run: |
          git config user.name fifty-bot
          git config user.email fifty-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || git commit -m "tick" && git push
